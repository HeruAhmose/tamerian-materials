name: Post-Workers Deploy Certification Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'probe/post-workers-deploy-cert-20260823'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 86467b3bbd83384827d78d2d42a3ea00c5ddf515
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build exact deployed main
        run: pnpm build
      - name: Inventory deployment hosts
        shell: bash
        run: |
          set -euo pipefail
          built_js="$(grep -oE '/assets/[^\" ]+\.js' dist/public/index.html | head -n1)"
          built_css="$(grep -oE '/assets/[^\" ]+\.css' dist/public/index.html | head -n1)"
          echo "EXPECTED_SHA=$(git rev-parse HEAD)"
          echo "EXPECTED_JS=$built_js"
          echo "EXPECTED_CSS=$built_css"
          echo "EXPECTED_JS_SHA256=$(sha256sum "dist/public${built_js}" | cut -d' ' -f1)"
          echo "EXPECTED_CSS_SHA256=$(sha256sum "dist/public${built_css}" | cut -d' ' -f1)"

          probe() {
            label="$1"
            base="$2"
            file="/tmp/${label}.html"
            echo "--- $label $base ---"
            if ! curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/" > "$file"; then
              echo "RESULT=FETCH_FAIL"
              return 0
            fi
            js="$(grep -oE '/assets/[^\" ]+\.js' "$file" | head -n1 || true)"
            css="$(grep -oE '/assets/[^\" ]+\.css' "$file" | head -n1 || true)"
            echo "JS=$js"
            echo "CSS=$css"
            if [ -n "$js" ]; then
              if curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base$js" > "/tmp/${label}.js"; then
                echo "JS_SHA256=$(sha256sum "/tmp/${label}.js" | cut -d' ' -f1)"
              fi
            fi
            if [ -n "$css" ]; then
              if curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base$css" > "/tmp/${label}.css"; then
                echo "CSS_SHA256=$(sha256sum "/tmp/${label}.css" | cut -d' ' -f1)"
              fi
            fi
          }

          probe custom https://tamerian-materials.com
          probe pages_alias https://tamerian-materials.pages.dev
          probe pages_exact https://d80e9073.tamerian-materials.pages.dev
          probe workers_alias https://tamerian-materials.aitconsult22.workers.dev
