name: restore-quantum-section
on:
  push:
    branches: [feat/prestige-organism-20260823]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/prestige-organism-20260823
          fetch-depth: 0
      - name: Restore untouched QuantumSection from certified production baseline
        run: |
          git show 70860a00309b7085e4db9640c5d8528394ec32a0:client/src/pages/Home.tsx > /tmp/baseline-home.tsx
          python3 - <<'PY'
          from pathlib import Path
          current_path = Path('client/src/pages/Home.tsx')
          baseline = Path('/tmp/baseline-home.tsx').read_text(encoding='utf-8')
          current = current_path.read_text(encoding='utf-8')
          q_start = baseline.index('// ─── Quantum Sensing Section ───')
          q_end = baseline.index('// ─── Applications Section ───', q_start)
          quantum = baseline[q_start:q_end].rstrip()
          marker = '// ─── Applications Section ───'
          assert 'function QuantumSection()' not in current
          current = current.replace(marker, quantum + '\n\n' + marker, 1)
          current_path.write_text(current, encoding='utf-8')
          print('TAMERIAN_QUANTUM_RESTORE=PASS')
          PY
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write client/src/pages/Home.tsx
      - name: Commit restoration
        run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/Home.tsx
          git commit -m 'fix(prestige): preserve quantum sensing section'
          git push origin HEAD:feat/prestige-organism-20260823
