name: prestige-organism-patch
on:
  push:
    branches: [feat/prestige-organism-20260823]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/prestige-organism-20260823
      - run: python3 scripts/apply_prestige_organism.py
      - name: Commit patched organism
        run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/public/trai-organism-v5.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(organism): activate seven-region prestige system'
          git push origin HEAD:feat/prestige-organism-20260823
