name: Experience runtime

on:
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - "scripts/audit-experience-runtime.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/experience-runtime.yml"
  push:
    branches: [main]
    paths:
      - "client/**"
      - "scripts/audit-experience-runtime.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/experience-runtime.yml"

permissions:
  contents: read

concurrency:
  group: experience-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked graph
        run: pnpm install --frozen-lockfile
      - name: Validate source and build
        run: |
          pnpm audit --audit-level=high
          pnpm run ci
      - name: Launch static server and Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4188 --directory dist/public >/tmp/tamerian-http.log 2>&1 &
          echo $! >/tmp/tamerian-http.pid
          rm -rf /tmp/tamerian-experience-chrome
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --no-first-run --disable-background-networking \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9238 \
            --remote-allow-origins='*' --user-data-dir=/tmp/tamerian-experience-chrome \
            about:blank >/tmp/tamerian-chrome.log 2>&1 &
          echo $! >/tmp/tamerian-chrome.pid
          for _ in $(seq 1 240); do
            if curl --fail --silent http://127.0.0.1:4188/ >/dev/null && curl --fail --silent http://127.0.0.1:9238/json/version >/dev/null; then
              exit 0
            fi
            sleep .25
          done
          cat /tmp/tamerian-http.log || true
          cat /tmp/tamerian-chrome.log || true
          exit 1
      - name: Browser-certify consent, SFX, motion, mute, reduced motion, favicon, and layout
        run: |
          node scripts/audit-experience-runtime.mjs
          cat tamerian-experience-audit.json
      - name: Stop browser laboratory
        if: always()
        shell: bash
        run: |
          if test -f /tmp/tamerian-chrome.pid; then kill "$(cat /tmp/tamerian-chrome.pid)" 2>/dev/null || true; fi
          if test -f /tmp/tamerian-http.pid; then kill "$(cat /tmp/tamerian-http.pid)" 2>/dev/null || true; fi
          cat /tmp/tamerian-chrome.log || true
          cat /tmp/tamerian-http.log || true
