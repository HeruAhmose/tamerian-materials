name: Express 5 types lock refresh

on:
  push:
    branches: [security/express5-types-20260817]
    paths:
      - package.json
      - .github/workflows/express5-types-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/express5-types-20260817

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm

      - name: Preserve manifest
        run: cp package.json /tmp/package.before.json

      - name: Resolve targeted dependency graph
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Materialize graph without lifecycle scripts
        run: pnpm install --ignore-scripts

      - name: Format lockfile with repository Prettier
        run: pnpm exec prettier --write pnpm-lock.yaml

      - name: Prove manifest did not drift
        run: cmp --silent package.json /tmp/package.before.json

      - name: Commit lockfile only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already aligned"
            exit 0
          fi
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M pnpm-lock.yaml$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build: align Express 5 type lock graph"
          git push
