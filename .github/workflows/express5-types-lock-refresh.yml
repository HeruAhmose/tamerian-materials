name: Express 5 types lock refresh

on:
  push:
    branches: [security/express5-runtime-alignment-20260817]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/express5-runtime-alignment-20260817

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm

      - name: Refresh lockfile from package.json only
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Ensure resolver did not rewrite package.json
        run: git diff --exit-code -- package.json

      - name: Commit resolved lockfile and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/express5-types-lock-refresh.yml
          git add pnpm-lock.yaml .github/workflows/express5-types-lock-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh lockfile for Express 5 types"
          git push origin HEAD:security/express5-runtime-alignment-20260817
