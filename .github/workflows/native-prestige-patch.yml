name: native-prestige-patch
on:
  push:
    branches: [feat/prestige-organism-20260823]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/prestige-organism-20260823
      - run: python3 scripts/apply_native_prestige_sections.py
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write client/src/pages/Home.tsx
      - name: Commit native prestige sections
        run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/Home.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(prestige): elevate material process and device storytelling'
          git push origin HEAD:feat/prestige-organism-20260823
