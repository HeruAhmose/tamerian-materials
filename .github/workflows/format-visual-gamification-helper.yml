name: Format Visual Gamification Helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix/visual-semantic-gamification-20260822'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed source
        run: |
          pnpm exec prettier --write client/src/components/ResearchProgress.tsx client/src/pages/Home.tsx
          pnpm exec prettier --check client/src/components/ResearchProgress.tsx client/src/pages/Home.tsx
      - name: Commit formatting
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/components/ResearchProgress.tsx client/src/pages/Home.tsx
          git commit -m 'style(ui): apply repository Prettier output'
          git push origin HEAD:${{ github.head_ref }}
