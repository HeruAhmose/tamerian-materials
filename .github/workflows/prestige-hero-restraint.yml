name: Temporary Prestige Hero Restraint

on:
  push:
    branches: [style/prestige-hero-restraint-20260823]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: style/prestige-hero-restraint-20260823
      - uses: pnpm/action-setup@8573dd5e4d3b5682f2e7cccb42488af92a4b4993
        with:
          version: 11.22.0
      - name: Restrain ambient hero density
        shell: python
        run: |
          from pathlib import Path
          p = Path('client/src/pages/Home.tsx')
          s = p.read_text()
          s = s.replace('<FloatingElements count={8} color="#45e8d8" type="hex" />', '<FloatingElements count={5} color="#45e8d8" type="hex" />')
          s = s.replace('<FloatingElements count={5} color="#a485ff" type="ring" />', '<FloatingElements count={2} color="#a485ff" type="ring" />')
          s = s.replace('style={{ backgroundImage: `url(${IMAGES.hero})`, opacity: 0.3 }}', 'style={{ backgroundImage: `url(${IMAGES.hero})`, opacity: 0.38 }}')
          p.write_text(s)
      - name: Format changed source
        run: pnpm exec prettier --write client/src/pages/Home.tsx
      - name: Commit application change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- client/src/pages/Home.tsx; then
            echo 'No application changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/Home.tsx
          git commit -m 'style(hero): reduce ambient density and elevate material focus'
          git push origin HEAD:style/prestige-hero-restraint-20260823
