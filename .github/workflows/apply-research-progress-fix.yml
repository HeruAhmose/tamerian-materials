name: Apply Research Progress Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/research-progress-intersection-20260823'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/research-progress-intersection-20260823
      - name: Lower impossible tall-section observer threshold
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client/src/components/ResearchProgress.tsx')
          s = p.read_text()
          old = '{ threshold: [0.35, 0.55] }'
          new = '{ threshold: [0.15, 0.25] }'
          if old not in s:
              raise SystemExit('expected threshold not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- client/src/components/ResearchProgress.tsx
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/components/ResearchProgress.tsx
          git commit -m 'fix(research): allow tall sections to earn mission progress'
          git push origin HEAD:fix/research-progress-intersection-20260823
