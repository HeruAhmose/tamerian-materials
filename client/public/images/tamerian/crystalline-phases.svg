    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0e8d8"/><stop offset=".42" stop-color="#a485ff"/><stop offset="1" stop-color="#45e8d8"/></linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
