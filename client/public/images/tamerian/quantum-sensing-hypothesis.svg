<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Rare-earth sensing hypothesis</title>
  <desc id="desc">Concept illustration of addressable centers embedded in a crystal host.</desc>
  <defs>
    <radialGradient id="bg"><stop stop-color="#26152a"/><stop offset=".55" stop-color="#0b0a17"/><stop offset="1" stop-color="#030308"/></radialGradient>
    <radialGradient id="n"><stop stop-color="#fff"/><stop offset=".3" stop-color="#ff7eb6"/><stop offset="1" stop-color="#a485ff" stop-opacity="0"/></radialGradient>
    <filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g fill="none" transform="translate(600 400)">
    <ellipse rx="330" ry="118" stroke="#ff7eb6" stroke-opacity=".34" stroke-width="2"/>
    <ellipse rx="330" ry="118" stroke="#a485ff" stroke-opacity=".34" stroke-width="2" transform="rotate(60)"/>
    <ellipse rx="330" ry="118" stroke="#45e8d8" stroke-opacity=".3" stroke-width="2" transform="rotate(120)"/>
    <circle r="210" stroke="#f0e8d8" stroke-opacity=".12" stroke-dasharray="4 12"/>
    <path d="M-250-250L250 250M250-250L-250 250M0-310V310" stroke="#f0e8d8" stroke-opacity=".07"/>
  </g>
  <g filter="url(#g)"><circle cx="600" cy="400" r="58" fill="url(#n)"/><circle cx="870" cy="475" r="22" fill="#45e8d8"/><circle cx="425" cy="188" r="19" fill="#ff7eb6"/><circle cx="410" cy="595" r="17" fill="#a485ff"/></g>
  <g fill="none" stroke="#e8c44a" stroke-opacity=".55"><path d="M185 400h230" stroke-dasharray="5 10"/><path d="M785 400h230" stroke-dasharray="5 10"/><circle cx="600" cy="400" r="118"/></g>
</svg>
